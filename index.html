<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zombie · RE4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --menu-x: 3vw;
    --menu-y: 5vh;

    /* RE4 palette */
    --re4-bg-0: #060403;
    --re4-bg-1: #0c0a07;
    --re4-bg-2: #14100b;
    --re4-bg-3: #1c1610;
    --re4-metal: #1a1410;
    --re4-ink: #e8dcc8;
    --re4-ink-dim: #b8a888;
    --re4-ink-faint: #6b5f4a;
    --re4-orange: #ff6b1a;
    --re4-orange-hot: #ff8c42;
    --re4-orange-dark: #c44a0e;
    --re4-red: #c41e1e;
    --re4-red-hot: #ff2a2a;
    --re4-yellow: #e8b83a;
    --re4-border: #3a2a1a;
    --re4-border-hot: #ff6b1a;

    --ease-spring: cubic-bezier(0.19, 1, 0.22, 1);
    --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    background: transparent !important;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--re4-ink);
}

#root {
    height: 100%;
    background: transparent !important;
    pointer-events: none;
    position: relative;
}

/* ============================================================
   MAIN WRAPPER
   ============================================================ */
.PWrapper {
    position: absolute;
    display: flex;
    left: var(--menu-x);
    top: var(--menu-y);
    justify-content: center;
    align-items: stretch;
    flex-direction: column;
    filter: drop-shadow(0 0.6vw 2vw rgba(0,0,0,0.85));
    pointer-events: auto;
    opacity: 0;
    transform: translateY(0.6vw);
    transition: opacity 0.35s var(--ease-soft), transform 0.5s var(--ease-spring);
    width: 19.0104vw;
}
.PWrapper.fadeIn {
    opacity: 1;
    transform: translateY(0);
}

/* corner brackets */
.PWrapper::before,
.PWrapper::after {
    content: "";
    position: absolute;
    width: 0.6vw;
    height: 0.6vw;
    border: 0.08vw solid var(--re4-orange);
    pointer-events: none;
    filter: drop-shadow(0 0 0.2vw var(--re4-orange));
    opacity: 0.85;
}
.PWrapper::before {
    top: -0.15vw; left: -0.15vw;
    border-right: none; border-bottom: none;
}
.PWrapper::after {
    bottom: -0.15vw; right: -0.15vw;
    border-left: none; border-top: none;
}

/* ============================================================
   BANNER
   ============================================================ */
.PWrapper .PBanner {
    position: relative;
    display: flex;
    width: 100%;
    height: 3.2vw;
    justify-content: center;
    align-items: center;
    flex-direction: row;
    gap: 0.6vw;
    overflow: hidden;
    border: 0.08vw solid var(--re4-border);
    border-bottom: none;
    background:
        linear-gradient(180deg, var(--re4-bg-2) 0%, var(--re4-bg-0) 100%),
        repeating-linear-gradient(45deg,
            rgba(255,107,26,0.03) 0,
            rgba(255,107,26,0.03) 0.1vw,
            transparent 0.1vw,
            transparent 0.2vw);
}
.PWrapper .PBanner::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.05vw;
    background: linear-gradient(90deg, transparent, var(--re4-orange), transparent);
    box-shadow: 0 0 0.3vw var(--re4-orange);
}
.PWrapper .PBanner::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 0.08vw;
    background: linear-gradient(90deg, transparent 0%, var(--re4-orange) 30%, var(--re4-orange-hot) 50%, var(--re4-orange) 70%, transparent 100%);
    box-shadow: 0 0 0.4vw var(--re4-orange);
    opacity: 0.9;
}
.PWrapper .PBanner .PBannerIcon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.4vw;
    height: 1.4vw;
    border: 0.08vw solid var(--re4-orange);
    border-radius: 0.1vw;
    color: var(--re4-orange);
    font-size: 0.8vw;
    transform: rotate(45deg);
    box-shadow: 0 0 0.3vw rgba(255,107,26,0.4), inset 0 0 0.2vw rgba(255,107,26,0.2);
}
.PWrapper .PBanner .PBannerIcon i {
    transform: rotate(-45deg);
}
.PWrapper .PBanner .PBannerText {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.08vw;
}
.PWrapper .PBanner .PBannerText .PTitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.92vw;
    font-weight: 700;
    letter-spacing: 0.18vw;
    color: var(--re4-ink);
    text-shadow: 0 0 0.3vw rgba(255,107,26,0.5);
}
.PWrapper .PBanner .PBannerText .PTitle .PAccent {
    color: var(--re4-orange);
}
.PWrapper .PBanner .PBannerText .PSub {
    font-family: 'Special Elite', serif;
    font-size: 0.5vw;
    font-weight: 400;
    letter-spacing: 0.2vw;
    color: var(--re4-ink-faint);
    text-transform: uppercase;
}

/* ============================================================
   ELEMENTS ROW
   ============================================================ */
.PWrapper .PElements {
    position: relative;
    display: flex;
    justify-content: flex-start;
    align-items: stretch;
    flex-direction: row;
    gap: 0.26vw;
}

/* ============================================================
   SCROLL
   ============================================================ */
.PWrapper .PElements .PScroll {
    position: absolute;
    display: flex;
    right: -0.95vw;
    top: 0;
    width: 0.5vw;
    height: 100%;
    background: var(--re4-bg-0);
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    gap: 0.15vw;
    border: 0.06vw solid var(--re4-border);
    box-shadow: inset 0 0 0.3vw rgba(0,0,0,0.9);
}
.PWrapper .PElements .PScroll i {
    font-size: 0.5vw;
    color: var(--re4-ink-faint);
    margin: 0.12vw 0;
    transition: color 0.2s;
}
.PWrapper .PElements .PScroll:hover i { color: var(--re4-orange); }
.PWrapper .PElements .PScroll .PSProgressWrapper {
    position: relative;
    display: flex;
    width: 0.28vw;
    height: 90%;
    justify-content: center;
    align-items: flex-start;
}
.PWrapper .PElements .PScroll .PSProgress {
    position: relative;
    display: flex;
    width: 0.22vw;
    margin-top: 0.15vw;
    background: linear-gradient(180deg, var(--re4-orange-hot) 0%, var(--re4-orange-dark) 100%);
    box-shadow: 0 0 0.35vw var(--re4-orange);
    transition: top 0.25s ease, height 0.25s ease;
}

/* ============================================================
   RIGHT ELEMENTS
   ============================================================ */
.PWrapper .PElements .PRightElements {
    position: relative;
    display: flex;
    width: 19.0104vw;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    border-left: 0.08vw solid var(--re4-border);
    border-right: 0.08vw solid var(--re4-border);
    background:
        linear-gradient(180deg, var(--re4-bg-1) 0%, var(--re4-bg-0) 100%),
        repeating-linear-gradient(0deg,
            rgba(255,107,26,0.02) 0,
            rgba(255,107,26,0.02) 0.05vw,
            transparent 0.05vw,
            transparent 0.1vw);
    position: relative;
}
.PWrapper .PElements .PRightElements::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: -0.05vw;
    width: 0.05vw;
    background: linear-gradient(180deg, transparent 0%, var(--re4-orange) 50%, transparent 100%);
    opacity: 0.3;
    pointer-events: none;
}
.PWrapper .PElements .PRightElements::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: -0.05vw;
    width: 0.05vw;
    background: linear-gradient(180deg, transparent 0%, var(--re4-orange) 50%, transparent 100%);
    opacity: 0.3;
    pointer-events: none;
}

/* ============================================================
   CATEGORIES / BREADCRUMB
   ============================================================ */
.PWrapper .PCategories {
    position: relative;
    display: flex;
    width: 100%;
    height: 1.4vw;
    justify-content: flex-start;
    align-items: center;
    flex-direction: row;
    padding: 0 0.7vw;
    background: var(--re4-bg-0);
    border-bottom: 0.06vw solid var(--re4-border);
    overflow: hidden;
    gap: 0.4vw;
}
.PWrapper .PCategories::before {
    content: "▸";
    color: var(--re4-orange);
    font-size: 0.6vw;
    filter: drop-shadow(0 0 0.15vw var(--re4-orange));
}
.PWrapper .PCategories .PCategory {
    position: relative;
    display: flex;
    text-align: left;
    height: 100%;
    justify-content: flex-start;
    align-items: center;
    font-family: 'Special Elite', serif;
    font-size: 0.58vw;
    font-weight: 400;
    letter-spacing: 0.18vw;
    color: var(--re4-ink-faint);
    text-transform: uppercase;
    transition: color 0.25s;
    cursor: default;
}
.PWrapper .PCategories .PCategory.active {
    color: var(--re4-orange);
    text-shadow: 0 0 0.25vw rgba(255,107,26,0.6);
}
.PWrapper .PCategories .PCategory + .PCategory::before {
    content: "·";
    margin: 0 0.4vw;
    color: var(--re4-ink-faint);
}

/* ============================================================
   TABS
   ============================================================ */
.PWrapper .PTabs {
    position: relative;
    display: flex;
    width: 19.0104vw;
    height: auto;
    max-height: 14.0625vw;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    background: transparent;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.15vw 0;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -ms-overflow-style: none;
}
.PWrapper .PTabs::-webkit-scrollbar { display: none; }

/* ACTIVE INDICATOR — sharp side bar */
.PWrapper .PTabs .activeIndicator {
    position: absolute;
    width: 100%;
    left: 0;
    top: 0;
    height: 1.5625vw;
    background: linear-gradient(90deg,
        rgba(255,107,26,0.18) 0%,
        rgba(255,107,26,0.04) 60%,
        transparent 100%);
    border-left: 0.12vw solid var(--re4-orange);
    box-shadow:
        inset 0.06vw 0 0 0 rgba(255,107,26,0.4),
        0 0 0.4vw rgba(255,107,26,0.35);
    z-index: 0;
    pointer-events: none;
    transition:
        top 0.32s var(--ease-spring),
        height 0.22s var(--ease-spring);
}

/* TAB ROW */
.PWrapper .PTabs .PTab {
    position: relative;
    display: flex;
    width: 100%;
    height: 1.5625vw;
    min-height: 1.5625vw;
    max-height: 1.5625vw;
    justify-content: center;
    align-items: center;
    transition: background 0.2s ease;
    border-bottom: 0.03vw solid rgba(255,107,26,0.05);
    z-index: 1;
    padding-left: 0.5vw;
}
.PWrapper .PTabs .PTab:hover {
    background: rgba(255,107,26,0.04);
}
.PWrapper .PTabs .PTab.active {
    background: transparent;
}

.PWrapper .PTabs .PTab .PTLabel {
    position: absolute;
    display: flex;
    align-items: center;
    left: 0.75vw;
    width: 62%;
    height: 60%;
    font-family: 'Inter', sans-serif;
    font-size: 0.63vw;
    font-weight: 400;
    letter-spacing: 0.02vw;
    color: var(--re4-ink-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.25s, letter-spacing 0.25s;
}
.PWrapper .PTabs .PTab.active .PTLabel {
    color: var(--re4-ink);
    font-weight: 500;
    letter-spacing: 0.03vw;
    text-shadow: 0 0 0.2vw rgba(255,107,26,0.3);
}

.PWrapper .PTabs .PTab i.fa-angle-right,
.PWrapper .PTabs .PTab i.fa-chevron-right {
    position: absolute;
    display: flex;
    right: 0.75vw;
    font-size: 0.55vw;
    color: var(--re4-ink-faint);
    transition: color 0.25s, transform 0.25s;
}
.PWrapper .PTabs .PTab.active i.fa-angle-right,
.PWrapper .PTabs .PTab:hover i.fa-angle-right,
.PWrapper .PTabs .PTab.active i.fa-chevron-right,
.PWrapper .PTabs .PTab:hover i.fa-chevron-right {
    color: var(--re4-orange);
    transform: translateX(0.1vw);
}

/* CHECKBOX — sharp square */
.PWrapper .PTabs .PTab .Checkbox {
    position: absolute;
    right: 0.75vw;
    display: flex;
    width: 0.85vw;
    height: 0.85vw;
    justify-content: center;
    align-items: center;
    background: var(--re4-bg-2);
    border: 0.06vw solid var(--re4-border);
    border-radius: 0.05vw;
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    box-shadow: inset 0 0.05vw 0.15vw rgba(0,0,0,0.9);
    color: var(--re4-orange);
    font-size: 0.55vw;
    font-weight: 700;
}
.PWrapper .PTabs .PTab .Checkbox.Checked {
    background: var(--re4-orange-dark);
    border-color: var(--re4-orange);
    color: var(--re4-bg-0);
    box-shadow:
        inset 0 0.05vw 0.15vw rgba(0,0,0,0.5),
        0 0 0.35vw rgba(255,107,26,0.6);
}
.PWrapper .PTabs .PTab .Checkbox .Inside {
    display: none;
}
.PWrapper .PTabs .PTab .Checkbox.Checked::before {
    content: "✕";
    color: var(--re4-bg-0);
    font-size: 0.6vw;
    line-height: 1;
    text-shadow: 0 0 0.15vw rgba(0,0,0,0.3);
}

/* SLIDER — sharp bar */
.PWrapper .PTabs .PTab .Slider {
    position: absolute;
    right: 0.75vw;
    display: flex;
    width: 2.4vw;
    height: 0.22vw;
    justify-content: flex-start;
    align-items: center;
    background: var(--re4-bg-2);
    border: 0.05vw solid var(--re4-border);
    box-shadow: inset 0 0.06vw 0.12vw rgba(0,0,0,0.9);
}
.PWrapper .PTabs .PTab .Slider .Progress {
    position: relative;
    display: flex;
    height: 100%;
    align-items: center;
    background: linear-gradient(90deg, var(--re4-orange-dark) 0%, var(--re4-orange) 100%);
    box-shadow: 0 0 0.3vw rgba(255,107,26,0.5);
    transition: width 0.28s var(--ease-spring);
}
.PWrapper .PTabs .PTab .Slider .Progress .Thumb {
    position: absolute;
    right: -0.15vw;
    width: 0.32vw;
    height: 0.55vw;
    background: linear-gradient(180deg, var(--re4-orange-hot) 0%, var(--re4-orange-dark) 100%);
    border: 0.04vw solid var(--re4-orange-hot);
    box-shadow:
        0 0 0.3vw rgba(255,107,26,0.7),
        inset 0 0 0.1vw rgba(255,255,255,0.3);
}

/* TOptions */
.PWrapper .PTabs .PTab .TOptions {
    position: absolute;
    right: 0.75vw;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-direction: row;
    gap: 0.55vw;
}
.PWrapper .PTabs .PTab .TOptions .Slider { position: relative; right: auto; }
.PWrapper .PTabs .PTab .TOptions .Checkbox { position: relative; right: auto; }

/* SCROLLABLE */
.PWrapper .PTabs .PTab .Scrollable {
    position: absolute;
    right: 0.75vw;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: row;
    gap: 0.35vw;
    font-family: 'Inter', sans-serif;
    font-size: 0.58vw;
    font-weight: 500;
    color: var(--re4-ink);
    letter-spacing: 0.03vw;
}
.PWrapper .PTabs .PTab .Scrollable span:first-child,
.PWrapper .PTabs .PTab .Scrollable span:last-child {
    color: var(--re4-orange);
    font-weight: 600;
}

/* DIVIDER */
.PWrapper .PTabs .PTab .Divider {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    width: 92%;
    justify-content: space-between;
    align-items: center;
    flex-direction: row;
    gap: 0.4vw;
}
.PWrapper .PTabs .PTab .Divider .Left,
.PWrapper .PTabs .PTab .Divider .Right {
    flex: 1;
    height: 0.04vw;
    background: linear-gradient(90deg, transparent 0%, var(--re4-orange) 50%, transparent 100%);
    opacity: 0.5;
}
.PWrapper .PTabs .PTab .Divider .Label {
    font-family: 'Special Elite', serif;
    font-size: 0.58vw;
    font-weight: 400;
    letter-spacing: 0.2vw;
    color: var(--re4-orange);
    white-space: nowrap;
    padding: 0 0.4vw;
    text-transform: uppercase;
    text-shadow: 0 0 0.2vw rgba(255,107,26,0.4);
}

/* ============================================================
   FOOTER
   ============================================================ */
.PWrapper .PFooter {
    position: relative;
    display: flex;
    width: 19.0104vw;
    height: 1.4vw;
    justify-content: space-between;
    align-items: center;
    padding: 0 0.7vw;
    background: var(--re4-bg-0);
    border-top: 0.06vw solid var(--re4-border);
    border-left: 0.08vw solid var(--re4-border);
    border-right: 0.08vw solid var(--re4-border);
    border-bottom: 0.08vw solid var(--re4-border);
    box-shadow: inset 0 -0.06vw 0 0 rgba(255,107,26,0.2);
}
.PWrapper .PFooter .PBuild {
    font-family: 'Special Elite', serif;
    font-size: 0.5vw;
    font-weight: 400;
    letter-spacing: 0.18vw;
    color: var(--re4-ink-faint);
    text-transform: uppercase;
}
.PWrapper .PFooter .PBuild .PAccent {
    color: var(--re4-orange);
}
.PWrapper .PFooter .PIndicator {
    font-family: 'Inter', sans-serif;
    font-size: 0.52vw;
    font-weight: 500;
    color: var(--re4-orange);
    letter-spacing: 0.05vw;
    text-shadow: 0 0 0.2vw rgba(255,107,26,0.4);
}

/* ============================================================
   METADATA PANEL
   ============================================================ */
.PWrapper .Metadata {
    position: absolute;
    display: flex;
    width: 13.5vw;
    right: -15.5vw;
    top: -3.4vw;
    flex-direction: column;
    gap: 0.2vw;
    background: var(--re4-bg-1);
    border: 0.08vw solid var(--re4-border);
    padding: 0.6vw 0.55vw;
    box-shadow:
        0 0.5vw 1.5vw rgba(0,0,0,0.85),
        inset 0 0 0.4vw rgba(0,0,0,0.6);
}
.PWrapper .Metadata::before,
.PWrapper .Metadata::after {
    content: "";
    position: absolute;
    width: 0.45vw;
    height: 0.45vw;
    border: 0.06vw solid var(--re4-orange);
    pointer-events: none;
    filter: drop-shadow(0 0 0.15vw var(--re4-orange));
}
.PWrapper .Metadata::before {
    top: -0.1vw; left: -0.1vw;
    border-right: none; border-bottom: none;
}
.PWrapper .Metadata::after {
    bottom: -0.1vw; right: -0.1vw;
    border-left: none; border-top: none;
}
.PWrapper .Metadata .Title {
    display: flex;
    width: 100%;
    justify-content: center;
    align-items: center;
    padding-bottom: 0.2vw;
    border-bottom: 0.04vw solid var(--re4-border);
}
.PWrapper .Metadata .Title span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85vw;
    font-weight: 700;
    letter-spacing: 0.1vw;
    color: var(--re4-orange);
    text-shadow: 0 0 0.3vw rgba(255,107,26,0.5);
    text-align: center;
    text-transform: uppercase;
}
.PWrapper .Metadata .Line {
    display: none;
}
.PWrapper .Metadata .Values {
    display: flex;
    width: 100%;
    flex-direction: column;
    gap: 0.15vw;
    margin-top: 0.2vw;
}
.PWrapper .Metadata .Values .Value {
    display: flex;
    width: 100%;
    justify-content: flex-start;
    align-items: center;
    padding: 0.08vw 0;
    border-bottom: 0.03vw solid rgba(255,107,26,0.08);
}
.PWrapper .Metadata .Values .Value:last-child { border-bottom: none; }
.PWrapper .Metadata .Values .Value .Key {
    font-family: 'Special Elite', serif;
    font-size: 0.52vw;
    font-weight: 400;
    letter-spacing: 0.15vw;
    color: var(--re4-ink-faint);
    text-transform: uppercase;
}
.PWrapper .Metadata .Values .Value .Val {
    position: absolute;
    right: 0.55vw;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.3vw;
}
.PWrapper .Metadata .Values .Value .Val span {
    font-family: 'Inter', sans-serif;
    font-size: 0.55vw;
    font-weight: 600;
    color: var(--re4-ink);
    letter-spacing: 0.03vw;
}
.PWrapper .Metadata .Values .Value .Val .Status {
    display: flex;
    width: 0.22vw;
    height: 0.85vw;
    background: var(--re4-bg-0);
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
    border: 0.03vw solid var(--re4-border);
}
.PWrapper .Metadata .Values .Value .Val .Status .Progress {
    width: 100%;
    bottom: 0;
    transition: height 0.25s;
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
.NotificationsWrapper {
    position: fixed;
    top: 0.9vw;
    right: 0.9vw;
    display: flex;
    flex-direction: column;
    gap: 0.45vw;
    z-index: 9999;
    pointer-events: none;
}
.Notification {
    position: relative;
    width: 17vw;
    padding: 0.65vw 0.85vw;
    display: flex;
    align-items: center;
    gap: 0.6vw;
    pointer-events: auto;
    background: var(--re4-bg-1);
    border: 0.06vw solid var(--re4-border);
    border-left: 0.18vw solid var(--re4-orange);
    color: var(--re4-ink);
    font-family: 'Inter', sans-serif;
    opacity: 0;
    transform: translateX(140%);
    transition: opacity 0.3s, transform 0.7s var(--ease-spring);
    overflow: hidden;
    box-shadow:
        0 0.4vw 1.2vw rgba(0,0,0,0.8),
        inset 0 0 0.3vw rgba(0,0,0,0.6),
        0 0 0.3vw rgba(255,107,26,0.15);
}
.Notification::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.03vw;
    background: linear-gradient(90deg, transparent, rgba(255,107,26,0.5), transparent);
}
.Notification.enter {
    opacity: 1;
    transform: translateX(0);
}
.Notification.exit {
    opacity: 0;
    transform: translateX(40%);
}
.Notification i {
    font-size: 0.95vw;
    flex-shrink: 0;
    color: var(--re4-orange);
    filter: drop-shadow(0 0 0.2vw rgba(255,107,26,0.6));
}
.Notification.success { border-left-color: var(--re4-yellow); }
.Notification.success i { color: var(--re4-yellow); filter: drop-shadow(0 0 0.2vw rgba(232,184,58,0.6)); }
.Notification.error { border-left-color: var(--re4-red-hot); }
.Notification.error i { color: var(--re4-red-hot); filter: drop-shadow(0 0 0.2vw rgba(255,42,42,0.6)); }

.Notification .NotificationContent {
    display: flex;
    flex-direction: column;
    gap: 0.08vw;
    flex: 1;
    min-width: 0;
}
.Notification .NotificationTitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.78vw;
    font-weight: 700;
    letter-spacing: 0.08vw;
    color: var(--re4-ink);
    text-transform: uppercase;
}
.Notification.success .NotificationTitle { color: var(--re4-yellow); }
.Notification.error .NotificationTitle { color: var(--re4-red-hot); }
.Notification .NotificationDesc {
    font-size: 0.58vw;
    color: var(--re4-ink-dim);
    line-height: 1.35;
    word-break: break-word;
}
.Notification .NotificationProgress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 0.12vw;
    width: 100%;
    background: linear-gradient(90deg, var(--re4-orange) 0%, var(--re4-orange-dark) 100%);
    animation-timing-function: linear;
    box-shadow: 0 0 0.2vw rgba(255,107,26,0.4);
}
.Notification.success .NotificationProgress { background: linear-gradient(90deg, var(--re4-yellow), #a07a1e); }
.Notification.error .NotificationProgress { background: linear-gradient(90deg, var(--re4-red-hot), var(--re4-red)); }

@keyframes progressBar {
    from { width: 100%; }
    to { width: 0%; }
}

/* ============================================================
   KEYBOARD INPUT
   ============================================================ */
.Overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 9998;
}
.InputWrapper {
    position: fixed;
    left: 50%;
    bottom: 8vw;
    transform: translateX(-50%);
    width: 26vw;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: var(--re4-bg-1);
    border: 0.08vw solid var(--re4-border);
    overflow: hidden;
    box-shadow:
        0 1vw 2.5vw rgba(0,0,0,0.9),
        0 0 0.6vw rgba(255,107,26,0.25);
    z-index: 9999;
    font-family: 'Inter', sans-serif;
}
.InputWrapper::before,
.InputWrapper::after {
    content: "";
    position: absolute;
    width: 0.5vw;
    height: 0.5vw;
    border: 0.08vw solid var(--re4-orange);
    pointer-events: none;
    filter: drop-shadow(0 0 0.2vw var(--re4-orange));
}
.InputWrapper::before {
    top: -0.15vw; left: -0.15vw;
    border-right: none; border-bottom: none;
}
.InputWrapper::after {
    bottom: -0.15vw; right: -0.15vw;
    border-left: none; border-top: none;
}
.InputWrapper .Header {
    display: flex;
    width: 100%;
    height: 1.35vw;
    justify-content: flex-start;
    align-items: center;
    gap: 0.35vw;
    border-bottom: 0.06vw solid var(--re4-border);
    background: var(--re4-bg-0);
    padding: 0 0.6vw;
}
.InputWrapper .Header i {
    color: var(--re4-orange);
    font-size: 0.62vw;
    filter: drop-shadow(0 0 0.2vw rgba(255,107,26,0.6));
}
.InputWrapper .Header .Line {
    width: 0.06vw;
    height: 0.7vw;
    background: var(--re4-border);
}
.InputWrapper .Header span {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 0.72vw;
    letter-spacing: 0.1vw;
    color: var(--re4-ink);
    text-transform: uppercase;
}
.InputWrapper .Body {
    display: flex;
    width: 100%;
    height: 1.9vw;
    justify-content: center;
    align-items: center;
    background: var(--re4-bg-1);
}
.InputWrapper .Body .InsideCon {
    display: flex;
    width: 97.5%;
    height: 70%;
    background: var(--re4-bg-0);
    border: 0.05vw solid var(--re4-border);
    justify-content: flex-start;
    align-items: center;
    box-shadow: inset 0 0.1vw 0.25vw rgba(0,0,0,0.9);
}
.InputWrapper .Body span {
    display: flex;
    margin-left: 0.55vw;
    font-family: 'Inter', sans-serif;
    font-size: 0.62vw;
    color: var(--re4-orange);
    letter-spacing: 0.03vw;
}
.InputWrapper .Body .InsideCon span::after {
    content: "";
    display: inline-block;
    width: 0.06vw;
    height: 0.65vw;
    background: var(--re4-orange);
    margin-left: 0.12vw;
    animation: blink 1s steps(2, start) infinite;
    box-shadow: 0 0 0.2vw var(--re4-orange);
}
@keyframes blink { to { visibility: hidden; } }

/* ============================================================
   KEYBINDS PANEL
   ============================================================ */
.KBLWrapper {
    position: fixed;
    right: 1vw;
    top: 1vw;
    display: flex;
    width: 8vw;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    border: 0.06vw solid var(--re4-border);
    overflow: hidden;
    box-shadow:
        0 0.4vw 1.2vw rgba(0,0,0,0.8),
        0 0 0.4vw rgba(255,107,26,0.2);
    background: var(--re4-bg-1);
    z-index: 9999;
}
.KBLWrapper .Header {
    display: flex;
    width: 100%;
    height: 1.05vw;
    align-items: center;
    background: var(--re4-bg-0);
    border-bottom: 0.06vw solid var(--re4-border);
    padding: 0 0.35vw;
    gap: 0.25vw;
}
.KBLWrapper .Header .Icon {
    color: var(--re4-orange);
    font-size: 0.55vw;
    filter: drop-shadow(0 0 0.2vw rgba(255,107,26,0.5));
}
.KBLWrapper .Header span {
    font-family: 'Special Elite', serif;
    font-size: 0.55vw;
    font-weight: 400;
    letter-spacing: 0.18vw;
    color: var(--re4-orange);
    text-transform: uppercase;
}
.KBLWrapper .Binds {
    display: flex;
    width: 100%;
    flex-direction: column;
    gap: 0.1vw;
    background: var(--re4-bg-1);
    padding: 0.2vw 0.3vw;
}
.KBLWrapper .Binds .Keybind {
    display: flex;
    width: 100%;
    height: 0.72vw;
    justify-content: flex-start;
    align-items: center;
    border-bottom: 0.03vw solid rgba(255,107,26,0.06);
    position: relative;
}
.KBLWrapper .Binds .Keybind:last-child { border-bottom: none; }
.KBLWrapper .Binds .Keybind .Label {
    position: absolute;
    left: 0.1vw;
    font-size: 0.52vw;
    font-weight: 400;
    color: var(--re4-ink-dim);
}
.KBLWrapper .Binds .Keybind .Elements {
    position: absolute;
    right: 0.1vw;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.2vw;
}
.KBLWrapper .Binds .Keybind .Elements span {
    font-size: 0.52vw;
    font-weight: 600;
    color: var(--re4-orange);
    letter-spacing: 0.03vw;
}

/* ============================================================
   CROSSHAIR
   ============================================================ */
.Crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1.4vw;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 0.3vw var(--re4-orange));
    pointer-events: none;
    z-index: 9997;
    opacity: 0.85;
}

/* ============================================================
   FREECAM
   ============================================================ */
.FCWrapper {
    position: fixed;
    left: 50%;
    bottom: 4vw;
    max-height: 13vw;
    transform: translateX(-50%);
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    gap: 0.3vw;
    z-index: 9997;
}
.FCWrapper .Option {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1vw;
    font-weight: 600;
    letter-spacing: 0.08vw;
    color: var(--re4-ink-dim);
    text-shadow:
        0 0 0.2vw rgba(0,0,0,0.95),
        0 0 0.5vw rgba(0,0,0,0.85);
    transition: opacity 0.25s, transform 0.15s, color 0.25s;
    text-transform: uppercase;
}
.FCWrapper .Option.Selected {
    color: var(--re4-orange);
    font-weight: 700;
    transform: scale(1.05);
    text-shadow:
        0 0 0.3vw rgba(255,107,26,0.9),
        0 0 0.6vw rgba(0,0,0,0.9);
}
.FCWrapper .Option .FCdash {
    color: var(--re4-orange);
    font-weight: 700;
}
.FCWrapper .Option .CycleHighlight {
    color: var(--re4-orange-hot);
    font-weight: 700;
    letter-spacing: 0.05vw;
    text-shadow: 0 0 0.3vw rgba(255,107,26,0.7);
}

::-webkit-scrollbar { width: 0; height: 0; background: transparent; }

/* ============================================================
   DESCRIPTION
   ============================================================ */
.Desc {
    position: fixed;
    left: 50%;
    bottom: 1.4vw;
    transform: translateX(-50%);
    display: flex;
    width: auto;
    max-width: 62vw;
    background: var(--re4-bg-1);
    border: 0.06vw solid var(--re4-border);
    border-top: 0.06vw solid var(--re4-orange);
    padding: 0.55vw 0.95vw;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.6vw;
    letter-spacing: 0.03vw;
    color: var(--re4-ink-dim);
    justify-content: center;
    align-items: center;
    box-shadow:
        0 0.4vw 1.2vw rgba(0,0,0,0.8),
        0 0 0.4vw rgba(255,107,26,0.15);
    text-align: center;
    z-index: 9996;
}
.Desc span { color: var(--re4-ink-dim); }
.Desc .hazard { color: var(--re4-yellow); margin-left: 0.3vw; font-weight: 500; }
.Desc .locked { color: var(--re4-red-hot); margin-left: 0.3vw; font-weight: 500; }

/* FADE */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(0.5vw); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(0.5vw); }
}
.fadeIn { animation: fadeIn 0.3s var(--ease-soft); }
.fadeOut { animation: fadeOut 0.22s var(--ease-soft); }
</style>
</head>
<body>
<div id="root">
    <div class="PWrapper" id="menuWrapper" style="visibility: hidden;">
        <div class="PBanner">
            <div class="PBannerIcon"><i class="fa-solid fa-skull"></i></div>
            <div class="PBannerText">
                <span class="PTitle"><span class="PAccent">NEXUS</span> · RE4</span>
                <span class="PSub">zombie edition</span>
            </div>
        </div>
        <div class="PElements">
            <div class="PScroll">
                <i class="fa-solid fa-angle-up"></i>
                <div class="PSProgressWrapper">
                    <div class="PSProgress" id="psProgress" style="height: 97%; top: 0%;"></div>
                </div>
                <i class="fa-solid fa-angle-down"></i>
            </div>
            <div class="PRightElements">
                <div class="PCategories" id="categories"></div>
                <div class="PTabs" id="tabs">
                    <div class="activeIndicator" id="activeIndicator"></div>
                </div>
                <div class="PFooter">
                    <span class="PBuild">discord.gg/<span class="PAccent">h2ck</span> · zombie</span>
                    <span class="PIndicator" id="footerIndicator">(0/0)</span>
                </div>
            </div>
        </div>
        <div class="Metadata" id="metadata" style="display:none;"></div>
    </div>

    <div class="NotificationsWrapper" id="notifications"></div>

    <div id="keyboardInput" style="display:none;">
        <div class="Overlay"></div>
        <div class="InputWrapper">
            <div class="Header">
                <i class="fa-solid fa-keyboard"></i>
                <div class="Line"></div>
                <span id="keyboardTitle">Keyboard Input</span>
            </div>
            <div class="Body">
                <div class="InsideCon">
                    <span id="keyboardValue"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="KBLWrapper" id="keybindsPanel" style="display:none;">
        <div class="Header">
            <i class="fa-solid fa-keyboard Icon"></i>
            <span>BINDS</span>
        </div>
        <div class="Binds" id="keybindsList"></div>
    </div>

    <img class="Crosshair" id="crosshair" src="https://files.catbox.moe/cm9g47.png" draggable="false" alt="" style="display:none;">

    <div class="FCWrapper" id="freecamOptions" style="display:none;"></div>

    <div class="Desc" id="descBox" style="display:none;">
        <span id="descText"></span>
    </div>
</div>

<script>
(function() {
    "use strict";

    const State = {
        visible: false,
        elements: [],
        index: 0,
        categories: null,
        categoryIndex: 0,
        menuPath: [],
        username: "discord.gg/h2ck : zombie",
        freecamVisible: false,
        freecamWeapons: [],
        freecamVehicles: [],
        freecamWeaponIndex: 0,
        freecamVehicleIndex: 0,
        freecamOptions: [
            "Default", "Teleport", "Shoot Weapon", "Spawn Vehicle",
            "Kick from Vehicle", "Hijack Vehicle", "Delete Vehicle"
        ],
        freecamOptionIndex: 0,
        notificationId: 0
    };

    const DOM = {
        wrapper: document.getElementById("menuWrapper"),
        tabs: document.getElementById("tabs"),
        categories: document.getElementById("categories"),
        activeIndicator: document.getElementById("activeIndicator"),
        footerIndicator: document.getElementById("footerIndicator"),
        metadata: document.getElementById("metadata"),
        notifications: document.getElementById("notifications"),
        keyboardInput: document.getElementById("keyboardInput"),
        keyboardTitle: document.getElementById("keyboardTitle"),
        keyboardValue: document.getElementById("keyboardValue"),
        keybindsPanel: document.getElementById("keybindsPanel"),
        keybindsList: document.getElementById("keybindsList"),
        crosshair: document.getElementById("crosshair"),
        freecamOptions: document.getElementById("freecamOptions"),
        descBox: document.getElementById("descBox"),
        descText: document.getElementById("descText"),
        psProgress: document.getElementById("psProgress")
    };

    function el(tag, className, html) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (html !== undefined) e.innerHTML = html;
        return e;
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function isNumber(v) { return typeof v === "number" && !isNaN(v); }

    function renderCategories() {
        DOM.categories.innerHTML = "";
        if (State.categories && State.categories.length > 0) {
            State.categories.forEach((cat, i) => {
                const c = el("div", "PCategory" + (i === State.categoryIndex ? " active" : ""));
                c.textContent = cat.label || "";
                DOM.categories.appendChild(c);
            });
        } else {
            const c = el("div", "PCategory active");
            c.textContent = State.menuPath.length > 0 ? State.menuPath[State.menuPath.length - 1] : "Main Menu";
            DOM.categories.appendChild(c);
        }
    }

    function renderTabs() {
        Array.from(DOM.tabs.querySelectorAll(".PTab")).forEach(n => n.remove());

        State.elements.forEach((tab, i) => {
            if (!tab || !tab.type) return;
            const tabEl = el("div", "PTab" + (i === State.index ? " active" : ""));
            tabEl.dataset.index = i;

            if (tab.type === "divider") {
                const divider = el("div", "Divider");
                divider.appendChild(el("div", "Left"));
                const label = el("span", "Label");
                label.textContent = tab.label || "";
                divider.appendChild(label);
                divider.appendChild(el("div", "Right"));
                tabEl.appendChild(divider);
                DOM.tabs.appendChild(tabEl);
                return;
            }

            const label = el("span", "PTLabel");
            let labelText = tab.label || "";

            if (i === State.index && tab.type === "slider") {
                const min = isNumber(tab.min) ? tab.min : 0;
                const val = isNumber(tab.value) ? tab.value : min;
                labelText = `${tab.label || ""}: ${val}`;
            } else if (i === State.index && tab.type === "slider-checkbox") {
                const min = isNumber(tab.min) ? tab.min : 0;
                const val = isNumber(tab.value) ? tab.value : min;
                labelText = `${tab.label || ""}: ${val}`;
            }
            label.textContent = labelText;

            if (tab.hazardous) {
                const hz = el("span");
                hz.style.color = "var(--re4-yellow)";
                hz.style.marginLeft = "0.2vw";
                hz.textContent = "⚠";
                label.appendChild(hz);
            }
            if (tab.locked) {
                const lk = el("span");
                lk.style.color = "var(--re4-red-hot)";
                lk.style.marginLeft = "0.2vw";
                lk.textContent = "🔒";
                label.appendChild(lk);
            }

            tabEl.appendChild(label);

            switch (tab.type) {
                case "subMenu": {
                    tabEl.appendChild(el("i", "fa-solid fa-chevron-right"));
                    break;
                }
                case "checkbox": {
                    const cb = el("div", "Checkbox" + (tab.checked ? " Checked" : ""));
                    cb.appendChild(el("div", "Inside"));
                    tabEl.appendChild(cb);
                    break;
                }
                case "slider": {
                    const sl = el("div", "Slider");
                    const prog = el("div", "Progress");
                    const min = isNumber(tab.min) ? tab.min : 0;
                    const max = isNumber(tab.max) ? tab.max : 100;
                    const val = isNumber(tab.value) ? tab.value : min;
                    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
                    prog.style.width = pct + "%";
                    prog.appendChild(el("div", "Thumb"));
                    sl.appendChild(prog);
                    tabEl.appendChild(sl);
                    break;
                }
                case "slider-checkbox": {
                    const wrap = el("div", "TOptions");
                    const sl = el("div", "Slider");
                    const prog = el("div", "Progress");
                    const min = isNumber(tab.min) ? tab.min : 0;
                    const max = isNumber(tab.max) ? tab.max : 100;
                    const val = isNumber(tab.value) ? tab.value : min;
                    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
                    prog.style.width = pct + "%";
                    prog.appendChild(el("div", "Thumb"));
                    sl.appendChild(prog);
                    wrap.appendChild(sl);
                    const cb = el("div", "Checkbox" + (tab.checked ? " Checked" : ""));
                    cb.appendChild(el("div", "Inside"));
                    wrap.appendChild(cb);
                    tabEl.appendChild(wrap);
                    break;
                }
                case "scrollable": {
                    const sc = el("div", "Scrollable");
                    const vals = tab.values || [];
                    const valIdx = isNumber(tab.value) ? tab.value - 1 : 0;
                    const current = vals[valIdx] !== undefined ? vals[valIdx] : "";
                    sc.appendChild(el("span", null, "‹"));
                    sc.appendChild(el("span", null, escapeHtml(current)));
                    sc.appendChild(el("span", null, "›"));
                    tabEl.appendChild(sc);
                    break;
                }
                case "scrollable-checkbox": {
                    const wrap = el("div", "TOptions");
                    const sc = el("div", "Scrollable");
                    const vals = tab.values || [];
                    const valIdx = isNumber(tab.value) ? tab.value - 1 : 0;
                    const current = vals[valIdx] !== undefined ? vals[valIdx] : "";
                    sc.appendChild(el("span", null, "‹"));
                    sc.appendChild(el("span", null, escapeHtml(current)));
                    sc.appendChild(el("span", null, "›"));
                    wrap.appendChild(sc);
                    const cb = el("div", "Checkbox" + (tab.checked ? " Checked" : ""));
                    cb.appendChild(el("div", "Inside"));
                    wrap.appendChild(cb);
                    tabEl.appendChild(wrap);
                    break;
                }
                case "button":
                default:
                    break;
            }

            DOM.tabs.appendChild(tabEl);
        });

        updateActiveIndicator();
        updateFooter();
        updateDesc();
    }

    function updateActiveIndicator() {
        const active = DOM.tabs.querySelector(".PTab.active");
        if (!active) {
            DOM.activeIndicator.style.opacity = "0";
            return;
        }
        DOM.activeIndicator.style.opacity = "1";
        DOM.activeIndicator.style.top = active.offsetTop + "px";
        DOM.activeIndicator.style.height = active.offsetHeight + "px";
        scrollActiveIntoView(active);
        updateScrollProgress();
    }

    function scrollActiveIntoView(activeEl) {
        const container = DOM.tabs;
        const containerTop = container.scrollTop;
        const containerBottom = containerTop + container.clientHeight;
        const elTop = activeEl.offsetTop;
        const elBottom = elTop + activeEl.offsetHeight;

        if (elTop < containerTop) container.scrollTop = elTop - 4;
        else if (elBottom > containerBottom) container.scrollTop = elBottom - container.clientHeight + 4;
    }

    function updateScrollProgress() {
        const container = DOM.tabs;
        const totalHeight = container.scrollHeight;
        const visibleHeight = container.clientHeight;

        if (totalHeight <= visibleHeight) {
            DOM.psProgress.style.height = "97%";
            DOM.psProgress.style.top = "0%";
            return;
        }

        const ratio = visibleHeight / totalHeight;
        const barHeight = Math.max(ratio * 97, 10);
        const maxTop = 97 - barHeight;
        const scrollRatio = container.scrollTop / (totalHeight - visibleHeight);
        const barTop = scrollRatio * maxTop;

        DOM.psProgress.style.height = barHeight + "%";
        DOM.psProgress.style.top = barTop + "%";
    }

    function updateFooter() {
        const total = State.elements.filter(e => e && e.type !== "divider").length;
        const current = State.elements.slice(0, State.index + 1).filter(e => e && e.type !== "divider").length;
        DOM.footerIndicator.textContent = `(${current}/${total})`;
    }

    function updateDesc() {
        const tab = State.elements[State.index];
        if (!tab || !tab.desc || tab.type === "divider") {
            DOM.descBox.style.display = "none";
            return;
        }
        DOM.descBox.style.display = "flex";
        let html = escapeHtml(tab.desc);
        if (tab.hazardous) html += '<span class="hazard">⚠ Server may detect</span>';
        if (tab.locked) html += '<span class="locked">🔒 Locked</span>';
        DOM.descText.innerHTML = html;
    }

    function renderMetadata() {
        const tab = State.elements[State.index];
        if (!tab || !tab.metaData || tab.metaData.length === 0) {
            DOM.metadata.style.display = "none";
            return;
        }
        DOM.metadata.style.display = "flex";
        DOM.metadata.innerHTML = "";

        const title = el("div", "Title");
        title.appendChild(el("span", null, escapeHtml(tab.name || tab.label || "")));
        DOM.metadata.appendChild(title);
        DOM.metadata.appendChild(el("div", "Line"));

        const values = el("div", "Values");
        tab.metaData.forEach(md => {
            const row = el("div", "Value");
            const key = el("div", "Key");
            key.textContent = md.key || "";
            row.appendChild(key);

            const val = el("div", "Val");
            const valSpan = el("span");
            valSpan.textContent = md.value !== undefined ? String(md.value) : "";
            if (md.key === "Weapons" || md.key === "الأسلحة") valSpan.style.color = "var(--re4-red-hot)";
            val.appendChild(valSpan);

            if ((md.key === "Health" || md.key === "Armour" ||
                 md.key === "دم الاعب" || md.key === "درع الاعب") && md.color) {
                const status = el("div", "Status");
                status.style.backgroundColor = `rgba(${md.color}, 0.15)`;
                const prog = el("div", "Progress");
                const num = parseInt(md.value, 10);
                prog.style.height = (isNaN(num) ? 0 : num) + "%";
                prog.style.backgroundColor = `rgb(${md.color})`;
                status.appendChild(prog);
                val.appendChild(status);
            }
            row.appendChild(val);
            values.appendChild(row);
        });
        DOM.metadata.appendChild(values);
    }

    function showNotification(type, title, desc, duration) {
        duration = duration || 4000;
        const id = ++State.notificationId;

        const notif = el("div", "Notification " + (type || "info"));
        notif.id = "notif-" + id;

        const iconName = type === "success" ? "fa-circle-check"
            : type === "error" ? "fa-circle-xmark"
            : "fa-triangle-exclamation";

        const icon = el("i", "fa-solid " + iconName);
        notif.appendChild(icon);

        const content = el("div", "NotificationContent");
        const t = el("div", "NotificationTitle");
        t.textContent = title || "Notification";
        content.appendChild(t);
        if (desc) {
            const d = el("div", "NotificationDesc");
            d.textContent = desc;
            content.appendChild(d);
        }
        notif.appendChild(content);

        const prog = el("div", "NotificationProgress");
        prog.style.animation = `progressBar ${duration}ms linear forwards`;
        notif.appendChild(prog);

        DOM.notifications.appendChild(notif);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => notif.classList.add("enter"));
        });

        setTimeout(() => {
            notif.classList.remove("enter");
            notif.classList.add("exit");
            setTimeout(() => notif.remove(), 700);
        }, duration);
    }

    function updateKeyboard(visible, title, value) {
        if (!visible) {
            DOM.keyboardInput.style.display = "none";
            return;
        }
        DOM.keyboardInput.style.display = "block";
        DOM.keyboardTitle.textContent = title || "Keyboard Input";
        DOM.keyboardValue.textContent = value || "";
    }

    function updateKeybinds(visible, binds) {
        if (!visible) {
            DOM.keybindsPanel.style.display = "none";
            return;
        }
        DOM.keybindsPanel.style.display = "flex";
        DOM.keybindsList.innerHTML = "";

        (binds || []).forEach(bind => {
            const row = el("div", "Keybind");
            const label = el("div", "Label");
            label.textContent = bind.label || "";
            row.appendChild(label);

            const elements = el("div", "Elements");
            const keySpan = el("span");
            const isToggle = bind.type === "checkbox" || bind.type === "slider-checkbox";
            keySpan.textContent = isToggle ? `(${bind.keyLabel || "?"})` : (bind.keyLabel || "?");
            elements.appendChild(keySpan);

            if (isToggle) {
                const statusSpan = el("span");
                statusSpan.textContent = bind.checked ? "ON" : "OFF";
                statusSpan.style.color = bind.checked ? "var(--re4-orange)" : "var(--re4-ink-faint)";
                elements.appendChild(statusSpan);
            }
            row.appendChild(elements);
            DOM.keybindsList.appendChild(row);
        });
    }

    function updateFreecam(visible, weaponIndex, vehicleIndex) {
        State.freecamVisible = visible;
        if (weaponIndex !== undefined) State.freecamWeaponIndex = weaponIndex - 1;
        if (vehicleIndex !== undefined) State.freecamVehicleIndex = vehicleIndex - 1;

        if (!visible) {
            DOM.freecamOptions.style.display = "none";
            DOM.crosshair.style.display = "none";
            return;
        }

        DOM.freecamOptions.style.display = "flex";
        DOM.crosshair.style.display = "block";
        DOM.freecamOptions.innerHTML = "";

        State.freecamOptions.forEach((opt, i) => {
            const isSelected = i === State.freecamOptionIndex;
            const dist = Math.abs(i - State.freecamOptionIndex);
            const opacity = Math.max(1 - dist * 0.12, 0.3);

            const optionEl = el("div", "Option" + (isSelected ? " Selected" : ""));
            optionEl.style.opacity = opacity;

            let html = "";
            if (isSelected) html += '<span class="FCdash">›</span>&nbsp;&nbsp;';
            html += escapeHtml(opt);
            if (isSelected && opt === "Shoot Weapon" && State.freecamWeapons[State.freecamWeaponIndex]) {
                html += `&nbsp;&nbsp;<span class="CycleHighlight">[${escapeHtml(State.freecamWeapons[State.freecamWeaponIndex])}]</span>`;
            }
            if (isSelected && opt === "Spawn Vehicle" && State.freecamVehicles[State.freecamVehicleIndex]) {
                html += `&nbsp;&nbsp;<span class="CycleHighlight">[${escapeHtml(State.freecamVehicles[State.freecamVehicleIndex])}]</span>`;
            }
            if (isSelected) html += '&nbsp;&nbsp;<span class="FCdash">‹</span>';
            optionEl.innerHTML = html;
            DOM.freecamOptions.appendChild(optionEl);
        });
    }

    function scrollFreecam(direction) {
        if (!State.freecamVisible) return;
        if (direction === "up") {
            State.freecamOptionIndex = (State.freecamOptionIndex - 1 + State.freecamOptions.length) % State.freecamOptions.length;
        } else {
            State.freecamOptionIndex = (State.freecamOptionIndex + 1) % State.freecamOptions.length;
        }
        updateFreecam(true);
    }

    function showUI() {
        State.visible = true;
        DOM.wrapper.style.visibility = "visible";
        DOM.wrapper.classList.remove("fadeOut");
        DOM.wrapper.classList.add("fadeIn");
        renderCategories();
        renderTabs();
        renderMetadata();
    }

    function hideUI() {
        State.visible = false;
        DOM.wrapper.classList.remove("fadeIn");
        DOM.wrapper.classList.add("fadeOut");
        setTimeout(() => {
            if (!State.visible) {
                DOM.wrapper.style.visibility = "hidden";
                DOM.metadata.style.display = "none";
                DOM.descBox.style.display = "none";
            }
        }, 240);
    }

    window.addEventListener("message", function(event) {
        const data = event.data;
        if (!data || typeof data !== "object") return;
        const action = data.action;

        switch (action) {
            case "showUI": {
                if (data.visible === false) { hideUI(); return; }
                if (Array.isArray(data.elements)) State.elements = data.elements;
                if (typeof data.index === "number") State.index = data.index;
                if (data.path) State.menuPath = data.path;
                if (data.username) State.username = data.username;
                if (Array.isArray(data.categories) && data.categories.length > 0) {
                    State.categories = data.categories;
                    State.categoryIndex = typeof data.categoryIndex === "number" ? data.categoryIndex : 0;
                } else { State.categories = null; State.categoryIndex = 0; }
                showUI();
                break;
            }
            case "updateElements": {
                if (Array.isArray(data.elements)) State.elements = data.elements;
                if (typeof data.index === "number") State.index = data.index;
                if (data.path) State.menuPath = data.path;
                if (Array.isArray(data.categories) && data.categories.length > 0) {
                    State.categories = data.categories;
                    State.categoryIndex = typeof data.categoryIndex === "number" ? data.categoryIndex : 0;
                } else { State.categories = null; State.categoryIndex = 0; }
                renderCategories();
                renderTabs();
                renderMetadata();
                break;
            }
            case "keydown": {
                if (typeof data.index === "number") {
                    State.index = data.index;
                    updateActiveTab();
                }
                break;
            }
            case "showNotification": {
                showNotification(
                    data.type || "info",
                    data.title || "Notification",
                    data.desc || "",
                    data.duration || 4000
                );
                break;
            }
            case "displayBinds": {
                updateKeybinds(!!data.visible, data.binds || []);
                break;
            }
            case "displayFreecam": {
                updateFreecam(!!data.visible, data.weaponIndex, data.vehicleIndex);
                break;
            }
            case "updateWeapon": {
                if (typeof data.index === "number") {
                    State.freecamWeaponIndex = data.index - 1;
                    updateFreecam(true);
                }
                break;
            }
            case "updateVehicle": {
                if (typeof data.index === "number") {
                    State.freecamVehicleIndex = data.index - 1;
                    updateFreecam(true);
                }
                break;
            }
            case "scroll": { scrollFreecam(data.direction); break; }
            case "updateKeyboard": { updateKeyboard(!!data.visible, data.title, data.value); break; }
            case "updateBanner": {
                if (data.bannerColor) {
                    const hex = String(data.bannerColor).replace("#","");
                    if (hex.length === 6) {
                        const r = parseInt(hex.substring(0,2),16);
                        const g = parseInt(hex.substring(2,4),16);
                        const b = parseInt(hex.substring(4,6),16);
                        if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                            document.documentElement.style.setProperty("--re4-orange", `rgb(${r},${g},${b})`);
                        }
                    }
                }
                break;
            }
            case "setMenuPosition": {
                const root = document.documentElement;
                if (data.x === "Left") root.style.setProperty("--menu-x", "3vw");
                else if (data.x === "Center") root.style.setProperty("--menu-x", "50vw");
                else if (data.x === "Right") root.style.setProperty("--menu-x", "85vw");

                if (data.y === "Top") root.style.setProperty("--menu-y", "5vh");
                else if (data.y === "Middle") root.style.setProperty("--menu-y", "50vh");
                else if (data.y === "Bottom") root.style.setProperty("--menu-y", "85vh");
                break;
            }
            case "updatePosition":
            case "updatePositionPrecise": {
                const root = document.documentElement;
                if (data.position) {
                    if (data.position.x !== undefined) root.style.setProperty("--menu-x", data.position.x + "%");
                    if (data.position.y !== undefined) root.style.setProperty("--menu-y", data.position.y + "%");
                }
                break;
            }
            case "getClipboard": { break; }
            default: break;
        }
    });

    function updateActiveTab() {
        const tabs = DOM.tabs.querySelectorAll(".PTab");
        tabs.forEach((t, i) => {
            if (i === State.index) t.classList.add("active");
            else t.classList.remove("active");
        });
        updateActiveIndicator();
        updateFooter();
        updateDesc();
        renderMetadata();
    }

    window.addEventListener("wheel", function(e) {
        if (!State.visible || State.freecamVisible) return;
        if (e.deltaY < 0) {
            State.index = (State.index - 1 + State.elements.length) % State.elements.length;
        } else {
            State.index = (State.index + 1) % State.elements.length;
        }
        updateActiveTab();
    }, { passive: true });

    DOM.tabs.addEventListener("scroll", function() {
        updateScrollProgress();
    }, { passive: true });

    window.addEventListener("resize", function() {
        updateActiveIndicator();
    });

    console.log("[zombie] RE4 UI ready.");
})();
</script>
</body>
</html>
